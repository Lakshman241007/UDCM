[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "udcm"
version = "0.1.0-alpha.0"
description = "Universal Data Collection & Intelligence Multi-Agent Engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "UDCM Core Architecture Team", email = "research@udcm.org" },
]
keywords = [
    "multi-agent",
    "data-collection",
    "data-intelligence",
    "schema-matching",
    "entity-resolution",
    "data-provenance",
    "autonomous-agents",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Database",
]

dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "duckdb>=1.0.0",
    "polars>=0.20.30",
    "networkx>=3.3",
    "rich>=13.7.1",
    "tenacity>=8.3.0",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.5",
    "pre-commit>=3.7.1",
]
geospatial = [
    "shapely>=2.0.4",
    "geopandas>=0.14.4",
    "pyproj>=3.6.1",
]
llm = [
    "litellm>=1.40.0",
]

[project.scripts]
udcm = "udcm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/udcm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=udcm"
testpaths = ["tests"]
pythonpath = ["src"]
